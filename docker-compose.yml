services:
  postgres:
    image: postgres:16-alpine
    container_name: shisha_postgres
    environment:
      POSTGRES_DB: shisha_tj
      POSTGRES_USER: shisha
      POSTGRES_PASSWORD: shisha_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shisha -d shisha_tj"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    container_name: shisha_seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq-data:/data

volumes:
  postgres-data:
  seq-data:
